name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    uses: BananaLabs-OSS/.github/.github/workflows/go-ci.yml@bdc81a8a0f751c60140d9d1505c56853475cc85f

  desktop:
    name: Tauri desktop
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, sirniklas-local]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Tauri Linux prerequisites
        run: |
          command -v cc
          command -v curl
          command -v file
          command -v pkg-config
          command -v wget
          pkg-config --exists webkit2gtk-4.1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.90.0
      - name: Compile native desktop
        run: cargo check --manifest-path desktop/Cargo.toml --locked
